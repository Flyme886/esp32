; Plant Pet for M5Stack StickS3 (ESP32-S3-PICO-1-N8R8, 8 MB flash, 8 MB PSRAM)
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified.git#0.3.0
    M5GFX=https://github.com/m5stack/M5GFX.git#0.3.0
    M5PM1=https://github.com/m5stack/M5PM1.git#1.0.7
